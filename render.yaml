databases:
  - name: bhabhi-thulla-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: bhabhi-thulla
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bhabhi-thulla-db
          property: connectionString
